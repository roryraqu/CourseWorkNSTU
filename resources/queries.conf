# Авторизация (получение профиля по auth_id)
GET_PROFILE=/rest/v1/ts_profiles?auth_id=eq.%1&select=*

# Восстановление сессии (получение профиля по ts_profiles.id)
GET_USER_BY_ID=/rest/v1/ts_profiles?id=eq.%1&select=*

# Получение регионов
GET_REGIONS=/rest/v1/ts_regions?select=id,name

# Получение тикетов (JOIN с профилями)
GET_TICKETS=/rest/v1/ts_tickets?select=id,title,status,created_at,has_unread_support,ts_profiles(fio)&order=created_at.desc

# Создание тикета (INSERT)
CREATE_TICKET=/rest/v1/ts_tickets

# Получение сообщений тикета
GET_MESSAGES=/rest/v1/ts_ticket_messages?ticket_id=eq.%1&select=*&order=created_at.asc

# Добавление сообщения
ADD_MESSAGE=/rest/v1/ts_ticket_messages

# Обновление тикета (статус, unread) - %1 = ticketId
UPDATE_TICKET=/rest/v1/ts_tickets?id=eq.%1

# Получение списка пользователей (Админка)
GET_USERS_ADMIN=/rest/v1/ts_profiles?select=*&order=id
GET_USERS_MANAGER=/rest/v1/ts_profiles?select=*&region_id=eq.%1&role=eq.user&order=id

# Обновление поля пользователя - %1 = userId
UPDATE_PROFILE=/rest/v1/ts_profiles?id=eq.%1